name: Validate Surge Config

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static config contract
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout public Surge Modules contract
        uses: actions/checkout@v4
        with:
          repository: BeatriceArchive/Beatrice-Surge-Modules
          ref: main
          path: Beatrice-Surge-Modules

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Beatrice-Surge.conf
        run: node scripts/validate-config.mjs

      - name: Validate public Config and Modules contract
        run: node scripts/validate-public-contract.mjs Beatrice-Surge.conf Beatrice-Surge-Modules/Modules/Beatrice-Surge-System.sgmodule
