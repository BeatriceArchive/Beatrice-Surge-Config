[General]
# Beatrice Surge Config
# General baseline for Surge iOS.
# Nodes are intentionally not stored in this public repository.

# DNS
# Keep upstream resolution network-adaptive; proxied domains remain resolved remotely by default.
dns-server = system
use-local-host-item-for-proxy = false

# Deterministic proxy availability testing (HTTP HEAD, no redirect).
proxy-test-url = http://www.gstatic.com/generate_204
test-timeout = 5

# Takeover mode
compatibility-mode = 3

# IPv6
ipv6 = false
ipv6-vif = disabled

# Network behavior
wifi-assist = false
all-hybrid = false
udp-priority = true
udp-policy-not-supported-behaviour = reject

# LAN / hotspot proxy sharing
allow-wifi-access = false
allow-hotspot-access = false
proxy-restricted-to-lan = true

# VIF scope
include-all-networks = true
include-local-networks = false
include-apns = false
include-cellular-services = false

# System proxy compatibility
exclude-simple-hostnames = true

# ICMP privacy
icmp-forwarding = false

# Logging
loglevel = notify

[Proxy Group]
# User-facing policy layer. Only the global manual group imports every real proxy directly.
🚀 手动选择 = select, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, include-all-proxies=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Global.png
🤖 AI = select, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, 🚀 手动选择, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/ChatGPT.png
🌍 流媒体 = select, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, 🚀 手动选择, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/GlobalMedia.png
🍎 Apple = select, DIRECT, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🇹🇼 台湾节点, 🇰🇷 韩国节点, 🚀 手动选择, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Apple.png

# Regional manual layer. Each select defaults to its hidden automatic helper, but can persistently pin a real node.
🇭🇰 香港节点 = select, ⚡ 香港自动, include-all-proxies=true, policy-regex-filter=(?i)(🇭🇰|香港|Hong Kong|(^|[- _/|()])港($|[- _/|()0-9])|(^|[^A-Za-z])HK([^A-Za-z]|$)), icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Hong_Kong.png
🇯🇵 日本节点 = select, ⚡ 日本自动, include-all-proxies=true, policy-regex-filter=(?i)(🇯🇵|日本|Japan|(^|[- _/|()])日($|[- _/|()0-9])|(^|[^A-Za-z])JP([^A-Za-z]|$)), icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Japan.png
🇸🇬 新加坡节点 = select, ⚡ 新加坡自动, include-all-proxies=true, policy-regex-filter=(?i)(🇸🇬|新加坡|狮城|Singapore|(^|[- _/|()])新($|[- _/|()0-9])|(^|[^A-Za-z])SG([^A-Za-z]|$)), icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Singapore.png
🇺🇸 美国节点 = select, ⚡ 美国自动, include-all-proxies=true, policy-regex-filter=(?i)(🇺🇸|美国|美國|United States|(^|[- _/|()])美($|[- _/|()0-9])|(^|[^A-Za-z])(US|USA)([^A-Za-z]|$)), icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/United_States.png
🇹🇼 台湾节点 = select, ⚡ 台湾自动, include-all-proxies=true, policy-regex-filter=(?i)(🇹🇼|台湾|台灣|Taiwan|(^|[- _/|()])台($|[- _/|()0-9])|(^|[^A-Za-z])TW([^A-Za-z]|$)), icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Taiwan.png
🇰🇷 韩国节点 = select, ⚡ 韩国自动, include-all-proxies=true, policy-regex-filter=(?i)(🇰🇷|韩国|韓國|(^|[^A-Za-z])((South )?Korea|KR)([^A-Za-z]|$)|(^|[- _/|()])韩($|[- _/|()0-9])|(^|[- _/|()])韓($|[- _/|()0-9])), icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-South_Korea.png

# Hidden automatic layer. REJECT is the explicit safety member: with no matching proxy, fallback remains fail-closed instead of becoming an empty-group SUBSTITUTE → DIRECT.
⚡ 香港自动 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇭🇰|香港|Hong Kong|(^|[- _/|()])港($|[- _/|()0-9])|(^|[^A-Za-z])HK([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Hong_Kong.png
⚡ 日本自动 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇯🇵|日本|Japan|(^|[- _/|()])日($|[- _/|()0-9])|(^|[^A-Za-z])JP([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Japan.png
⚡ 新加坡自动 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇸🇬|新加坡|狮城|Singapore|(^|[- _/|()])新($|[- _/|()0-9])|(^|[^A-Za-z])SG([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Singapore.png
⚡ 美国自动 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇺🇸|美国|美國|United States|(^|[- _/|()])美($|[- _/|()0-9])|(^|[^A-Za-z])(US|USA)([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/United_States.png
⚡ 台湾自动 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇹🇼|台湾|台灣|Taiwan|(^|[- _/|()])台($|[- _/|()0-9])|(^|[^A-Za-z])TW([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Taiwan.png
⚡ 韩国自动 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇰🇷|韩国|韓國|(^|[^A-Za-z])((South )?Korea|KR)([^A-Za-z]|$)|(^|[- _/|()])韩($|[- _/|()0-9])|(^|[- _/|()])韓($|[- _/|()0-9])), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-South_Korea.png

[Rule]
# Local / private
RULE-SET,LAN,DIRECT,no-resolve

# AI — Apple Intelligence must precede SYSTEM because SYSTEM also covers ls.apple.com.
# api.github.com is a general GitHub endpoint and is deliberately excluded from the AI aggregate.
DOMAIN,api.github.com,🚀 手动选择,extended-matching
DOMAIN-SUFFIX,deepseek.com,🤖 AI,extended-matching
DOMAIN-SUFFIX,deepseek.ai,🤖 AI,extended-matching
DOMAIN-SUFFIX,deepseekapi.com,🤖 AI,extended-matching
DOMAIN-SUFFIX,trae.ai,🤖 AI,extended-matching
DOMAIN-SUFFIX,marscode.com,🤖 AI,extended-matching
DOMAIN,trae-api-sg.mchost.guru,🤖 AI,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf,🤖 AI,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,🤖 AI,extended-matching

