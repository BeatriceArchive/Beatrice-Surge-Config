[General]
# Beatrice Surge Config
# General baseline for Surge iOS.
# Nodes are intentionally not stored in this public repository.

# DNS
# Keep upstream resolution network-adaptive; proxied domains remain resolved remotely by default.
dns-server = system
use-local-host-item-for-proxy = false

# Takeover mode
compatibility-mode = 3

# IPv6
ipv6 = false
ipv6-vif = disabled

# Network behavior
wifi-assist = false
all-hybrid = false
udp-priority = true
udp-policy-not-supported-behaviour = reject

# LAN / hotspot proxy sharing
allow-wifi-access = false
allow-hotspot-access = false
proxy-restricted-to-lan = true

# VIF scope
include-all-networks = true
include-local-networks = false
include-apns = false
include-cellular-services = false

# System proxy compatibility
exclude-simple-hostnames = true

# ICMP privacy
icmp-forwarding = false

# Logging
loglevel = notify

[Proxy Group]
# Core groups. Beatrice Sub injects the actual [Proxy] nodes at render time.
🚀 手动切换 = select, ⚡ 智能选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🇹🇼 台湾节点, include-all-proxies=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Global.png
🤖 AI服务 = select, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🚀 手动切换, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/ChatGPT.png
🌍 国外流媒体 = select, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇯🇵 日本节点, 🇺🇸 美国节点, 🇹🇼 台湾节点, 🚀 手动切换, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/GlobalMedia.png
🍎 苹果服务 = select, DIRECT, 🚀 手动切换, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇸 美国节点, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Apple.png
🌐 兜底策略 = select, 🚀 手动切换, DIRECT, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Final.png

# Hidden helpers. Global smart selection stays adaptive; regional groups fail closed with REJECT when no matching proxy is available.
⚡ 智能选择 = smart, include-all-proxies=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Global.png
🇭🇰 香港节点 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇭🇰|香港|Hong Kong|(^|[- _/|()])港|(^|[^A-Za-z])HK([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Hong_Kong.png
🇯🇵 日本节点 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇯🇵|日本|Japan|(^|[- _/|()])日|(^|[^A-Za-z])JP([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Japan.png
🇸🇬 新加坡节点 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇸🇬|新加坡|狮城|Singapore|(^|[- _/|()])新|(^|[^A-Za-z])SG([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Singapore.png
🇺🇸 美国节点 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇺🇸|美国|美國|United States|America|(^|[- _/|()])美|(^|[^A-Za-z])US([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/United_States.png
🇹🇼 台湾节点 = fallback, REJECT, include-all-proxies=true, policy-regex-filter=(?i)(🇹🇼|台湾|台灣|Taiwan|(^|[- _/|()])台|(^|[^A-Za-z])TW([^A-Za-z]|$)), evaluate-before-use=true, no-alert=true, hidden=true, icon-url=https://raw.githubusercontent.com/Aioneas/Surge/main/Icon/Taiwan.png
